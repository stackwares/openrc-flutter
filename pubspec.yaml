name: revenuecat
description: "RevenueCat Dashboard Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.1.0
  go_router: ^18.1.1
  dio: ^5.8.0
  flex_color_scheme: ^8.4.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  intl: ^0.20.2
  cached_network_image: ^4.0.5
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  firebase_crashlytics: ^6.0.0
  firebase_auth: ^7.0.0
  firebase_messaging: ^17.0.0
  cloud_functions: ^7.0.0
  cloud_firestore: ^7.0.0
  package_info_plus: ^10.2.2
  collection: ^1.19.1
  fl_chart: ^1.3.0
  flutter_floating_bottom_bar: ^1.4.0
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SanFrancisco
      fonts:
        - asset: assets/fonts/sfns.ttf
          weight: 400
        - asset: assets/fonts/sfns.ttf
          weight: 500
        - asset: assets/fonts/sfns.ttf
          weight: 700
        - asset: assets/fonts/sfns.ttf
          weight: 900
        - asset: assets/fonts/sfns_italic.ttf
          style: italic
