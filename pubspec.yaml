name: openrc
description: "OpenRC: an open-source RevenueCat dashboard for iOS, iPadOS, Android, macOS and the web."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.1.0
  dio: ^5.8.0
  flex_color_scheme: ^8.4.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  intl: ^0.20.2
  cached_network_image: ^4.0.5
  package_info_plus: ^10.2.2
  collection: ^1.19.1
  fl_chart: ^1.3.0
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  posthog_flutter: ^5.56.2
  easy_localization: ^3.0.8
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  crypto: ^3.0.7
  in_app_review: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/brand/openrc-mark.png
    - assets/translations/
  fonts:
    - family: SanFrancisco
      fonts:
        - asset: assets/fonts/sfns.ttf
          weight: 400
        - asset: assets/fonts/sfns.ttf
          weight: 500
        - asset: assets/fonts/sfns.ttf
          weight: 700
        - asset: assets/fonts/sfns.ttf
          weight: 900
        - asset: assets/fonts/sfns_italic.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
