<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` given to `flutter build web`. It must start
    and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenRC: your RevenueCat revenue, on every device</title>
  <meta name="description" content="An open-source RevenueCat dashboard. Every sale as it happens, this month's revenue, upcoming payouts and charts, on the web, iPhone, iPad, Android and Mac.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenRC">
  <meta property="og:title" content="OpenRC: your RevenueCat revenue, on every device">
  <meta property="og:description" content="Every sale as it happens, this month's revenue, upcoming payouts and charts. Open source.">
  <meta property="og:image" content="https://openrc.pages.dev/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenRC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: dark light; --bg: #0D0E10; --fg: #9A9DA6; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #F4F5F7; --fg: #5C606B; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); transition: opacity 240ms ease-out;
    }
    #splash img { width: 96px; height: 96px; animation: breathe 1.6s ease-in-out infinite; }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(0.94); opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>

</head>
<body>
  <div id="splash" aria-label="Loading OpenRC" role="status">
    <img src="icons/Icon-192.png" alt="">
    <span>OpenRC</span>
  </div>
  <noscript>OpenRC needs JavaScript to run.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
